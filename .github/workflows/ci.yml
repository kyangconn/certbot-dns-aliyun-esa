name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test
        run: uv run --locked pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify Certbot plugin discovery
        run: uv run --locked certbot plugins | grep -q dns-aliyun-esa
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project \
            --output-file "${RUNNER_TEMP}/requirements.txt"
          uv run --locked pip-audit --disable-pip --require-hashes \
            -r "${RUNNER_TEMP}/requirements.txt"
      - name: Build and inspect distributions
        run: |
          uv build --no-sources
          uv run --locked twine check dist/*
